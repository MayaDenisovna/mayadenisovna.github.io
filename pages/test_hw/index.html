<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа проверки кода</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="tests.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        select, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        textarea { width: 100%; height: 250px; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; resize: vertical; background-color: #fafafa; }
        #status { text-align: center; font-weight: bold; margin: 15px 0; height: 20px; color: #e67e22; }
        #results { margin-top: 20px; }
        .test-case { padding: 10px 15px; margin-bottom: 10px; border-radius: 5px; border-left: 5px solid #ccc; background: #f9f9f9; }
        .test-case.success { border-left-color: #2ecc71; background: #eafaf1; }
        .test-case.fail { border-left-color: #e74c3c; background: #fdedec; }
        .test-title { font-weight: bold; margin-bottom: 5px; }
        .details { font-family: monospace; font-size: 14px; white-space: pre-wrap; margin-top: 5px; color: #555; }
        .error-box { padding: 20px; background: #fdedec; border: 1px solid #e74c3c; border-radius: 5px; color: #c0392b; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Проверка задач по Python</h1>
    <div id="app">
        <div class="controls">
            <label for="taskSelect"><b>Задача:</b></label>
            <select id="taskSelect"></select>
            <button id="runBtn" onclick="runTests()" disabled>Загрузка Python...</button>
        </div>
        <textarea id="codeInput" placeholder="Вставьте сюда ваш код на Python..."></textarea>
        <div id="status"></div>
        <div id="results"></div>
    </div>
</div>

<script>
    if (typeof TASKS === 'undefined') {
        document.getElementById('app').innerHTML = 
            '<div class="error-box"><b>Ошибка:</b> файл <code>tests.js</code> не найден.<br>Убедитесь, что он лежит рядом с <code>index.html</code>.</div>';
        throw new Error("TASKS is not defined");
    }

    let pyodide;
    let isReady = false;

    function buildTaskList() {
        const select = document.getElementById('taskSelect');
        select.innerHTML = '';
        for (const id of Object.keys(TASKS)) {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = `${id}. ${TASKS[id].title || "Без названия"}`;
            select.appendChild(opt);
        }
    }
    buildTaskList();

    async function initPyodide() {
        try {
            pyodide = await loadPyodide();
            isReady = true;
            const btn = document.getElementById('runBtn');
            btn.disabled = false;
            btn.innerText = "Проверить код";
            document.getElementById('status').innerText = "";
        } catch (e) {
            document.getElementById('status').innerText = "Ошибка загрузки Python: " + e;
            document.getElementById('status').style.color = "#e74c3c";
        }
    }
    initPyodide();

    async function runTests() {
        const taskId = document.getElementById('taskSelect').value;
        const userCode = document.getElementById('codeInput').value;
        const resultsDiv = document.getElementById('results');
        const statusDiv = document.getElementById('status');

        if (!isReady) {
            statusDiv.innerText = "Python ещё загружается, подождите...";
            return;
        }

        const task = TASKS[taskId];
        if (!task || !task.tests) {
            statusDiv.innerText = "Для этой задачи нет тестов.";
            return;
        }

        resultsDiv.innerHTML = "";
        statusDiv.innerText = "Выполняется...";
        statusDiv.style.color = "#e67e22";

        let passed = 0;

        for (let i = 0; i < task.tests.length; i++) {
            let result;

            if (task.type === "interactive") {
                result = await runInteractiveTest(userCode, task.tests[i].secret);
            } else {
                result = await runStandardTest(userCode, task.tests[i].in, task.tests[i].out);
            }

            const div = document.createElement('div');
            div.className = `test-case ${result.success ? 'success' : 'fail'}`;

            if (result.success) {
                passed++;
                div.innerHTML = `<div class="test-title">Тест ${i + 1}: Пройден</div>`;
            } else {
                div.innerHTML = `
                    <div class="test-title">Тест ${i + 1}: Не пройден</div>
                    <div class="details"><b>Ожидалось:</b>\n${result.expected || 'Успешное угадывание'}\n<b>Получено:</b>\n${result.actual}</div>
                `;
            }
            resultsDiv.appendChild(div);
        }

        statusDiv.innerText = `Итог: пройдено ${passed} из ${task.tests.length}`;
        statusDiv.style.color = passed === task.tests.length ? "#2ecc71" : "#e74c3c";
    }

    async function runStandardTest(code, inputStr, expectedStr) {
        const wrapper = `
import sys, io, builtins

_inputs = ${JSON.stringify(inputStr.split('\n'))}
_input_idx = 0

def mock_input(prompt=""):
    global _input_idx
    if _input_idx >= len(_inputs):
        raise EOFError("Закончились входные данные")
    val = _inputs[_input_idx]
    _input_idx += 1
    return val

builtins.input = mock_input

_old_stdout = sys.stdout
sys.stdout = io.StringIO()
_locals = {}
try:
    exec(${JSON.stringify(code)}, _locals, _locals)
except Exception as e:
    sys.stdout.write(f"ERROR: {e}")

_result = sys.stdout.getvalue()
sys.stdout = _old_stdout
_result
        `;

        try {
            let actual = await pyodide.runPythonAsync(wrapper);
            actual = actual.trim();
            let expected = expectedStr.trim();
            return {
                success: actual === expected,
                expected: expected,
                actual: actual
            };
        } catch (e) {
            return { success: false, actual: "Ошибка выполнения: " + e };
        }
    }

    async function runInteractiveTest(code, secret) {
        const wrapper = `
import sys, io, builtins, re

_secret = ${secret}
_last_guess = None
_attempts = 0
_success = False

_old_stdout = sys.stdout
sys.stdout = io.StringIO()

def mock_print(*args, **kwargs):
    global _last_guess
    text = " ".join(map(str, args))
    numbers = re.findall(r'-?\\d+', text)
    if numbers:
        _last_guess = numbers[-1]
    _old_stdout.write(text + "\\n")

def mock_input(prompt=""):
    global _attempts, _success, _last_guess
    _attempts += 1
    if _attempts > 10:
        raise Exception("Превышено 10 попыток")
    if _last_guess is None:
        raise Exception("Программа не вывела число")
    try:
        g = int(_last_guess)
    except ValueError:
        raise Exception(f"'{_last_guess}' не число")
    if g == _secret:
        _success = True
        return "Угадал!"
    elif _secret > g:
        return "Больше"
    else:
        return "Меньше"

builtins.print = mock_print
builtins.input = mock_input

_locals = {}
try:
    exec(${JSON.stringify(code)}, _locals, _locals)
except Exception as e:
    _old_stdout.write(f"ERROR: {e}")

_result = sys.stdout.getvalue()
sys.stdout = _old_stdout
_result
        `;

        try {
            let actual = await pyodide.runPythonAsync(wrapper);
            let success = await pyodide.runPythonAsync(`_success`);
            return {
                success: success,
                expected: `Угадать число ${secret} за ≤10 попыток`,
                actual: actual.trim() || "Программа не вывела число"
            };
        } catch (e) {
            return { success: false, actual: "Ошибка выполнения: " + e };
        }
    }
</script>

</body>
</html>
